<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маршрутная карта — просмотр вариантов (для команды)</title>
<meta name="theme-color" content="#6E2C4D">
<meta name="robots" content="noindex, nofollow">

<style>
:root{
  --beige:#FCFAF6; --beige2:#F4EAD2;
  --rose-bg:#FBF1EF; --rose:#E7B7B5; --rose-line:#E4D5D2; --rose-deep:#C97B84;
  --bordeaux:#6E2C4D; --bordeaux-dark:#4E1E37;
  --sage:#6E8E7B; --sage-bg:#E9F0EB;
  --gold:#C29A4B;
  --ink:#3A2E33; --muted:#6A5A60;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--beige); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.protoflag{background:var(--bordeaux-dark);color:#fff;font-size:12.5px;text-align:center;padding:7px 14px;line-height:1.4}
.wrap{max-width:780px;margin:0 auto;padding:0 18px 60px}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;gap:11px;justify-content:center;padding:24px 0 4px}
.mark{width:26px;height:26px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 30%, var(--rose) 0%, var(--rose-deep) 55%, var(--bordeaux) 100%)}
.brandname{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--bordeaux);font-weight:700}

.hero{text-align:center;padding:18px 0 4px}
h1{font-size:31px;line-height:1.2;margin:0 0 6px;color:var(--bordeaux-dark);font-weight:700;letter-spacing:-.01em}
.hero .grp{font-size:19px;color:var(--rose-deep);font-weight:650;margin:0 0 10px}
.hero .lead{font-size:17px;color:var(--muted);margin:0}

.actions{display:flex;gap:10px;justify-content:center;margin:22px 0 4px;flex-wrap:wrap}
.pbtn{
  border:0;cursor:pointer;font:inherit;font-weight:650;font-size:16px;
  background:var(--bordeaux);color:#fff;padding:14px 24px;border-radius:11px;
  transition:background .18s ease;
}
.pbtn:hover{background:var(--bordeaux-dark)}
.pbtn.ghost{background:transparent;color:var(--bordeaux);border:1.5px solid var(--rose-line)}
.pbtn.ghost:hover{background:var(--rose-bg)}
.printhint{text-align:center;font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* ---------- секции ---------- */
.sec{
  background:#fff;border:1px solid var(--rose-line);border-radius:16px;
  padding:28px 30px;margin-top:20px;box-shadow:0 1px 2px rgba(78,30,55,.04),0 8px 22px rgba(78,30,55,.05);
}
.kicker{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--sage);font-weight:700;margin-bottom:8px}
h2{font-size:23px;line-height:1.25;margin:0 0 14px;color:var(--bordeaux-dark);font-weight:700}
h3{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bordeaux);font-weight:700;margin:26px 0 10px}
p{margin:0 0 12px}
.small{font-size:14.5px;color:var(--muted)}

.mirror{background:var(--rose-bg);border-left:4px solid var(--rose-deep);padding:18px 20px;
  border-radius:0 12px 12px 0;font-size:17.5px;margin:0 0 20px}

/* персональная плашка «вы отметили» */
.you{background:var(--sage-bg);border:1px solid #CFDDD3;border-radius:12px;padding:18px 20px;margin:0 0 8px}
.you b{display:block;color:var(--sage);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#fff;border:1px solid #CFDDD3;border-radius:99px;padding:5px 13px;font-size:15px;color:var(--ink)}
.chip.warn{background:#FDF8EF;border-color:var(--gold);color:#8a6d1f}

.numlist{counter-reset:n;list-style:none;padding:0;margin:0}
.numlist li{counter-increment:n;position:relative;padding-left:38px;margin-bottom:13px;font-size:16.5px}
.numlist li::before{content:counter(n);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:50%;
  background:var(--bordeaux);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---------- коридор ---------- */
.corridor{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.col{border-radius:12px;overflow:hidden;border:1px solid var(--rose-line)}
.col .head{padding:11px 13px;font-size:14.5px;font-weight:700;line-height:1.25;color:#fff}
.col.yes .head{background:var(--sage)} .col.care .head{background:var(--gold)} .col.doc .head{background:var(--bordeaux)}
.col.yes{background:#F5F9F6} .col.care{background:#FDF8EF} .col.doc{background:#FCF3F5}
.col ul{margin:0;padding:13px 14px 14px 28px;font-size:15px;line-height:1.42}
.col li{margin-bottom:8px} .col li:last-child{margin-bottom:0}

.note{border-radius:12px;padding:18px 20px;margin-top:18px;font-size:16px;line-height:1.5}
.note.gold{background:#FDF8EF;border:1.5px solid var(--gold);color:#6b4e12}
.note.rose{background:#FCF3F5;border:1.5px solid var(--rose-deep);color:var(--bordeaux-dark)}
.note.plain{background:var(--rose-bg);border:1.5px solid var(--rose-line);color:var(--ink)}
.note b{display:block;margin-bottom:6px;font-size:16px}

/* ---------- действия ---------- */
.act{border:1px solid var(--rose-line);border-radius:12px;padding:18px 20px;margin-bottom:12px;background:var(--beige)}
.act .r{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.act .n{width:26px;height:26px;border-radius:50%;background:var(--bordeaux);color:#fff;flex:none;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.act .name{font-size:17.5px;font-weight:700;color:var(--bordeaux-dark)}
.act .when{margin-left:auto;font-size:14px;color:var(--sage);font-weight:700}
.act .how{font-size:16px;margin:0 0 10px;padding-left:38px}
.act .miss{font-size:15px;color:var(--muted);padding-left:38px;border-top:1px dashed var(--rose-line);padding-top:9px}
.act .miss b{color:var(--rose-deep)}

/* ---------- поля и таблицы ---------- */
.fill{margin-top:14px}
.fill .lbl{font-size:15px;color:var(--muted);margin-bottom:5px}
.line{border-bottom:1px solid var(--rose);height:30px}
.line + .line{margin-top:4px}

table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid var(--rose-line);padding:8px 5px;text-align:center;font-size:14px}
th{background:var(--bordeaux);color:#fff;font-weight:600;font-size:13px;line-height:1.25}
td.day{background:var(--rose-bg);font-weight:700;color:var(--bordeaux);width:44px}
tr.week td{background:var(--sage-bg);color:var(--sage);font-weight:700;text-align:left;padding-left:12px;font-size:13.5px}
.legend{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:12px;font-size:15px;color:var(--muted)}
.legend b{color:var(--bordeaux);display:block;font-size:15.5px}

table.next td{text-align:left;vertical-align:top;font-size:16px;padding:13px 14px}
table.next td:first-child{width:38%;font-weight:700;color:var(--bordeaux-dark);background:var(--rose-bg)}

.disclaim{margin-top:20px;font-size:14px;color:var(--muted);line-height:1.5;
  background:var(--beige2);border-radius:10px;padding:16px 18px}

.goal{background:var(--rose-bg);border:1px solid var(--rose-line);border-radius:12px;padding:18px 20px;margin-top:18px}
.goal b{color:var(--bordeaux);display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.goal span{font-size:18px;font-weight:650;color:var(--bordeaux-dark)}

.demo{background:#FDF8EF;border:1.5px solid var(--gold);border-radius:12px;padding:16px 18px;margin-top:18px;font-size:15.5px;color:#6b4e12}


/* ---------- панель просмотра для команды ---------- */
.pnl{background:#4E1E37;color:#fff;border-radius:14px;padding:16px 18px;margin-top:18px}
.pnl-head{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#E7B7B5;font-weight:700;margin-bottom:12px}
.pnl-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.pnl-lbl{font-size:14px;color:#E4D5D2;min-width:150px}
.pnl-opts{display:flex;gap:6px;flex-wrap:wrap}
.pnl-b{font:inherit;font-size:14px;cursor:pointer;border:1px solid rgba(255,255,255,.28);
  background:transparent;color:#fff;padding:7px 13px;border-radius:8px;transition:all .15s ease}
.pnl-b:hover{background:rgba(255,255,255,.12)}
.pnl-b.on{background:#E7B7B5;color:#4E1E37;border-color:#E7B7B5;font-weight:700}
.pnl-note{font-size:13px;color:#C9AFB8;margin-top:10px;line-height:1.45}
@media (max-width:620px){ .pnl-lbl{min-width:100%} }
.demo{background:#FDF8EF;border:1.5px solid var(--gold);border-radius:12px;padding:16px 18px;margin-top:18px;font-size:15.5px;color:#6b4e12}

@media (max-width:720px){
  body{font-size:16px}
  .wrap{padding:0 13px 46px}
  .sec{padding:22px 18px;border-radius:12px}
  h1{font-size:25px} h2{font-size:20px}
  .corridor{grid-template-columns:1fr}
  .legend{grid-template-columns:1fr}
  .act .when{margin-left:0;width:100%}
}

/* ---------- печать ---------- */
@media print{
  @page{size:A4;margin:13mm 14mm 14mm 14mm}
  body{background:#fff;font-size:10.4pt}
  .protoflag,.actions,.printhint,.noprint{display:none !important}
  .wrap{max-width:none;padding:0}
  .top{padding:0 0 4mm}
  .sec{
    border:none;box-shadow:none;padding:0;margin:0 0 6mm;border-radius:0;
    break-inside:avoid; page-break-inside:avoid;
  }
  .sec.brk{page-break-before:always}
  h1{font-size:22pt} h2{font-size:15pt} h3{font-size:9.5pt;margin:6mm 0 2mm}
  .corridor{grid-template-columns:1fr 1fr 1fr;gap:3mm}
  .col ul{font-size:8.8pt;padding:3mm 3mm 3mm 6.5mm}
  .col .head{font-size:8.8pt;padding:2.5mm 3mm}
  .act{padding:4mm 5mm;margin-bottom:3mm;break-inside:avoid}
  .act .how,.act .miss{padding-left:9mm}
  th,td{font-size:8.4pt;padding:2mm 1.2mm}
  .line{height:7mm}
  tr,img{break-inside:avoid}
}
</style>
</head>

/* ================= РАЗБОР PAYLOAD ================= */
function d36(s){ var n = parseInt(s,36); return isNaN(n) ? 0 : n; }
function bits(mask, list){
  var r = [];
  for(var i=0;i<list.length;i++) if(mask & (1<<i)) r.push(i);
  return r;
}
function parse(p){
  if(!p || p.length < 16 || p.charAt(0) !== '1') return null;
  var g = p.charAt(13);
  if(['a','b','c'].indexOf(g) === -1) return null;
  return {
    age:      d36(p.charAt(1)),
    primary:  d36(p.charAt(2)),
    signals:  bits(d36(p.substr(3,2)), OPT.SIGNAL),
    impact:   d36(p.charAt(5)),
    sysneed:  d36(p.charAt(6)),
    intent:   d36(p.charAt(7)),
    limits:   bits(d36(p.substr(8,2)), OPT.LIMITS),
    safety:   d36(p.charAt(10)),
    desired:  d36(p.charAt(11)),
    group:    g,
    edition:  d36(p.charAt(14)),
    session:  p.substr(16,6)
  };
}
function getParam(){
  var q = window.location.search || '';
  var m = /[?&](?:p|start)=([0-9a-zA-Z_-]+)/.exec(q);
  return m ? m[1] : null;
}

/* ================= ХЕЛПЕРЫ ================= */
function h(html){ var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function li(arr){ return arr.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join(''); }


/* ================= РЕЖИМ ПРОСМОТРА ДЛЯ КОМАНДЫ =================
   Показывается только когда страница открыта без кода ответов.
   У женщины ссылка всегда приходит с кодом, и панели она не видит. */

  limits: [['none','нет'],['mild','спина, давление'],['high','операция за год']],
  safety: [['1','нет'],['2','не уверена'],['0','да — стоп']],
  branch: [['0','обычная'],['1','давно лечусь']]
};

  a:{ primary:0, signals:[1,2,3], desired:0 },
  b:{ primary:2, signals:[5,2],   desired:1 },
  c:{ primary:5, signals:[2,6],   desired:5 }

function stateToAnswers(s){
  var base = DEMO_BASE[s.group];
  var lim = s.limits === 'high' ? [0] : (s.limits === 'mild' ? [1,2] : [5]);
  return {
    age:1, primary:base.primary, signals:base.signals, impact:2, sysneed:1,
    intent: s.branch === '1' ? 3 : 0,
    limits:lim, safety:parseInt(s.safety,10), desired:base.desired,
    group:s.group, edition:0, session:''
  };
}
